- name: Disabling {{ package }} default version
  ansible.builtin.shell: dnf module disable "{{ package }}" -y

- name: Disabling {{ package }} default version
  ansible.builtin.shell: dnf module enable "{{ package }}":"{{ packageversion }}" -y


- name: Installing "{{ package }}"
  ansible.builtin.dnf:
      name: "{{ package }}"
      state: present

- name: Creating "{{ AppUser }}" user
  ansible.builtin.user:
      name: "{{ AppUser }}"
      state: present

- name: cleaning the "{{ AppDirectory }}"
  ansible.builtin.file:
        path: "{{ AppDirectory }}"
        state: absent
       
- name: Creating the "{{ AppDirectory }}"
  ansible.builtin.file:
      path: "{{ AppDirectory }}"
      state: directory

- name: Download and extract archive from URL
  ansible.builtin.unarchive:
    src: "{{ url }}"
    dest: "{{ AppDirectory }}"
    remote_src: true

- name: Run npm install
  ansible.builtin.command: npm install
  args:
    chdir: "{{ AppDirectory }}"

- name: Copying the template file
  ansible.builtin.template:
    src: "{{ component }}.service"
    dest: /etc/systemd/system/{{ component }}.service   

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Start and enable {{ component }} service
  ansible.builtin.service:
    name: "{{ component }}"
    state: started
    enabled: yes

- name: copying mongodb repo file
  ansible.builtin.copy:
    src: "mongodb.repo"
    dest: /etc/yum.repos.d/mongodb.repo

- name: installing mongodb
  ansible.builtin.dnf:
    name: mongodb-mongosh
    state: present    
   
     



  