apiVersion: v1
kind: ConfigMap
metadata:
  name: game-demo-configmap
data:
  # property-like keys; each key maps to a simple value
  player_initial_lives: "3"
  ui_properties_file_name: "user-interface.properties"

  # file-like keys
  game.properties: |
    enemy.types=aliens,monsters
    player.maximum-lives=5
  user-interface.properties: |
    color.good=purple
    color.bad=yellow
    allow.textmode=true

---
apiVersion: v1
kind: Pod
metadata:
  name: game-demo-pod
spec:
  containers:
  - name: game-demo-container
    image: nginx
    ports:
    - containerPort: 80
    envFrom:
    - configMapRef:
        name: game-demo-configmap      